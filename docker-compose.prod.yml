services:
  codeforge:
    build:
      context: .
      dockerfile: Dockerfile
    image: codeforge-pro:latest
    container_name: codeforge_app
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DATABASE_URL=file:./prisma/dev.db
      - JWT_SECRET=${JWT_SECRET:-replace_with_a_secure_random_64_char_hex_secret_key_in_production}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - FIREBASE_PROJECT_ID=${FIREBASE_PROJECT_ID:-codeforge-a}
      - PISTON_BASE_URL=https://emkc.org/api/v2/piston
    volumes:
      # Persistent volume for SQLite database across container redeployments
      - codeforge_db_data:/app/backend/prisma
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/api/compiler/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  codeforge_db_data:
    driver: local
