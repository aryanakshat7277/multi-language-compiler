<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#FAF4EE" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="CodeForge Pro" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>CodeForge Pro — Multi-Language Compiler & Cloud IDE</title>
    <!-- Preconnect to Render backend and warm it up immediately upon page load -->
    <link rel="preconnect" href="https://codeforge-pro.onrender.com" crossorigin />
    <link rel="dns-prefetch" href="https://codeforge-pro.onrender.com" />
    <script>
      (function() {
        try {
          // Immediately ping Render backend to trigger cold start while page renders
          fetch('/api/compiler/health', { cache: 'no-store' }).catch(function(){});
          fetch('https://codeforge-pro.onrender.com/api/compiler/health', { mode: 'no-cors', cache: 'no-store' }).catch(function(){});
        } catch(e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
