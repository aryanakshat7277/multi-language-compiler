<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>CodeForge Pro — Initializing</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0f172a;
    color: #f8fafc;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    user-select: none;
  }
  .container {
    text-align: center;
    max-width: 420px;
    padding: 30px;
  }
  .logo {
    width: 84px;
    height: 84px;
    margin-bottom: 20px;
    border-radius: 20px;
    box-shadow: 0 10px 30px rgba(234, 88, 12, 0.35);
  }
  h1 {
    font-size: 24px;
    font-weight: 700;
    letter-spacing: -0.5px;
    margin-bottom: 6px;
    color: #ffffff;
  }
  .subtitle {
    font-size: 13px;
    color: #94a3b8;
    margin-bottom: 24px;
  }
  .progress-bar-bg {
    width: 100%;
    height: 6px;
    background: #1e293b;
    border-radius: 4px;
    overflow: hidden;
    margin-bottom: 14px;
  }
  .progress-bar-fill {
    height: 100%;
    width: 40%;
    background: linear-gradient(90deg, #ea580c, #f97316, #fdba74);
    border-radius: 4px;
    animation: indeterminate 1.8s infinite ease-in-out;
  }
  @keyframes indeterminate {
    0% { transform: translateX(-100%); }
    50% { transform: translateX(100%); }
    100% { transform: translateX(300%); }
  }
  .status-text {
    font-size: 12px;
    color: #cbd5e1;
    font-family: ui-monospace, monospace;
  }
  .retry-btn {
    display: none;
    margin-top: 16px;
    padding: 8px 18px;
    background: #ea580c;
    color: #fff;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-size: 12px;
    font-weight: 600;
  }
  .retry-btn:hover { background: #c2410c; }
</style>
</head>
<body>
  <div class="container">
    <img src="icon.png" alt="CodeForge Pro Logo" class="logo">
    <h1>CodeForge Pro</h1>
    <div class="subtitle">Multi-Language Compiler &amp; AI Intelligence IDE</div>
    <div class="progress-bar-bg">
      <div class="progress-bar-fill"></div>
    </div>
    <div class="status-text" id="statusMsg">Connecting to Cloud Compiler Engine...</div>
    <button class="retry-btn" id="retryBtn" onclick="window.electronAPI.retry()">Retry Now</button>
  </div>
  <script>
    let elapsed = 0;
    const msgEl = document.getElementById('statusMsg');
    const timer = setInterval(() => {
      elapsed++;
      if (elapsed > 4 && elapsed <= 12) {
        msgEl.innerText = "Warming up container runtimes (Render cold-start)...";
      } else if (elapsed > 12) {
        msgEl.innerText = "Establishing secure connection & telemetry...";
      }
    }, 1000);
  </script>
</body>
</html>
